# The EVENING half of the "review window" flow: it generates and saves ONE new
# draft (published=false, published_at=null) and then opens a "pending-publish"
# Issue, so a human can edit that draft or stop it before the morning job
# publishes it. Sunday, Tuesday and Thursday at 12:30 UTC = 18:00 IST. GitHub
# Actions cron is always interpreted in UTC, so this slot stays fixed no matter
# where the runner or the repository is. The same run can be started by hand
# from the Actions tab (workflow_dispatch).
# Secrets are handed to the step as environment variables and are never echoed.
name: Generate blog draft

on:
  schedule:
    - cron: '30 12 * * 0,2,4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: generate-draft
  cancel-in-progress: false

jobs:
  generate-draft:
    name: Generate draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No npm install: generate-draft.mjs uses only built-in Node features.
      # With --save it writes slug= and title= into $GITHUB_OUTPUT.
      - name: Generate and save draft
        id: gen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: node generate-draft.mjs --save

      # Runs only when the generator actually saved a draft - with an empty slug
      # there is nothing to review, so no Issue is opened.
      # slug and title reach the shell through env: only, never inline in the
      # script text, so a generated title can never be read as a shell command.
      - name: Open the pending-publish Issue
        if: steps.gen.outputs.slug != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          set -euo pipefail

          gh label create pending-publish --force --description "Draft waiting for 9am auto-publish"

          body=$(printf '%s\n' \
            "Automated draft from the evening review window - please review it before 9 AM." \
            "" \
            "Draft title: $TITLE" \
            "" \
            "slug: $SLUG" \
            "" \
            "@Rachit-Sharma08, this draft is queued to go live automatically at 9:00 AM IST tomorrow." \
            "" \
            "What you can do:" \
            "- To EDIT it: open the admin panel and change the draft there." \
            "- To STOP the publish: close this Issue, or delete the draft." \
            "- If you do nothing: it publishes on its own at 9:00 AM IST." \
            "" \
            "The line that starts with \"slug\" above is machine-readable - please leave it in place so the morning job can find this draft.")

          gh issue create \
            --title "Goes live tomorrow 9:00 AM IST: $TITLE" \
            --label pending-publish \
            --body "$body"
